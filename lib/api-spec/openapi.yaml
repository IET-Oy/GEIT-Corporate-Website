openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: enquiries
    description: Public consultation enquiries
paths:
  /platform/engineering/{orgId}/carbon-footprint/factors:
    parameters:
      - $ref: "#/components/parameters/EnergyOrg"
    get:
      operationId: getEmissionFactors
      tags: [platform]
      responses:
        "200":
          description: All immutable factor versions in this organisation
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EmissionFactor" }
    post:
      operationId: createEmissionFactor
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmissionFactorInput" }
      responses:
        "201":
          description: New immutable factor version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmissionFactor" }
  /platform/engineering/{orgId}/digital-energy/sources:
    parameters:
      - $ref: "#/components/parameters/EnergyOrg"
    get:
      operationId: getDigitalTwinSources
      tags: [platform]
      responses:
        "200":
          description: Authorised non-demo sites and meters; no fabricated connections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DigitalTwinSources" }
  /platform/engineering/{orgId}/{module}/scenarios/{id}/ai:
    parameters:
      - $ref: "#/components/parameters/EnergyOrg"
      - $ref: "#/components/parameters/EngineeringModulePath"
      - $ref: "#/components/parameters/EnergyId"
    post:
      operationId: explainEngineeringScenario
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceQuestion" }
      responses:
        "200":
          description: AI-selected verified evidence; no AI-generated numeric claims
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceAnswer" }
  /platform/engineering/{orgId}/{module}:
    get:
      operationId: getEngineeringWorkspace
      parameters:
        - $ref: "#/components/parameters/EnergyOrg"
        - $ref: "#/components/parameters/EngineeringModulePath"
      responses:
        "200":
          description: Tenant-scoped projects and saved scenario summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineeringWorkspace" }
  /platform/engineering/{orgId}/{module}/projects:
    post:
      operationId: saveEngineeringProject
      parameters:
        - $ref: "#/components/parameters/EnergyOrg"
        - $ref: "#/components/parameters/EngineeringModulePath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EngineeringProjectInput" }
      responses:
        "200":
          description: Project created or updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineeringProject" }
  /platform/engineering/{orgId}/{module}/scenarios:
    post:
      operationId: createEngineeringScenario
      parameters:
        - $ref: "#/components/parameters/EnergyOrg"
        - $ref: "#/components/parameters/EngineeringModulePath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EngineeringScenarioInput" }
      responses:
        "201":
          description: Calculated and signed immutable scenario snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineeringScenario" }
  /platform/engineering/{orgId}/{module}/scenarios/{id}:
    get:
      operationId: getEngineeringScenario
      parameters:
        - $ref: "#/components/parameters/EnergyOrg"
        - $ref: "#/components/parameters/EngineeringModulePath"
        - $ref: "#/components/parameters/EnergyId"
      responses:
        "200":
          description: Verified saved input and result snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineeringScenario" }
  /platform/engineering/{orgId}/{module}/scenarios/{id}/export/{format}:
    get:
      operationId: exportEngineeringScenario
      parameters:
        - $ref: "#/components/parameters/EnergyOrg"
        - $ref: "#/components/parameters/EngineeringModulePath"
        - $ref: "#/components/parameters/EnergyId"
        - in: path
          name: format
          required: true
          schema: { type: string, enum: [csv, xlsx, pdf, json] }
      responses:
        "200":
          description: Saved engineering report with provenance and assumptions
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /platform/energy/{orgId}:
    get:
      operationId: getEnergyWorkspace
      parameters:
        - $ref: "#/components/parameters/EnergyOrg"
      responses:
        "200":
          description: Tenant energy records; customer and demo records explicitly labelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnergyWorkspace" }
  /platform/energy/{orgId}/records:
    post:
      operationId: saveEnergyRecord
      parameters:
        - $ref: "#/components/parameters/EnergyOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnergyRecordInput" }
      responses:
        "200":
          description: Site, building, asset, meter, tariff or alert rule saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformMessage" }
  /platform/energy/{orgId}/imports:
    post:
      operationId: previewEnergyImport
      parameters:
        - $ref: "#/components/parameters/EnergyOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnergyImportInput" }
      responses:
        "200":
          description: Persistent import preview with row-level validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnergyImport" }
  /platform/energy/{orgId}/imports/{id}/commit:
    post:
      operationId: commitEnergyImport
      parameters:
        - $ref: "#/components/parameters/EnergyOrg"
        - $ref: "#/components/parameters/EnergyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnergyEmptyInput" }
      responses:
        "200":
          description: All readings committed atomically, or none
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformMessage" }
  /platform/energy/{orgId}/analyses:
    post:
      operationId: createEnergyAnalysis
      parameters:
        - $ref: "#/components/parameters/EnergyOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnergyAnalysisInput" }
      responses:
        "201":
          description: Saved reproducible analysis snapshot and evaluated alerts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnergyAnalysis" }
  /platform/energy/{orgId}/analyses/{id}:
    get:
      operationId: getEnergyAnalysis
      parameters:
        - $ref: "#/components/parameters/EnergyOrg"
        - $ref: "#/components/parameters/EnergyId"
      responses:
        "200":
          description: Saved analysis snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnergyAnalysis" }
  /platform/energy/{orgId}/alerts/{id}/acknowledge:
    post:
      operationId: acknowledgeEnergyAlert
      parameters:
        - $ref: "#/components/parameters/EnergyOrg"
        - $ref: "#/components/parameters/EnergyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnergyEmptyInput" }
      responses:
        "200":
          description: Alert acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformMessage" }
  /platform/energy/{orgId}/demo:
    post:
      operationId: createEnergyDemo
      parameters:
        - $ref: "#/components/parameters/EnergyOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnergyEmptyInput" }
      responses:
        "200":
          description: Separate synthetic demo records created or already present
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformMessage" }
  /platform/energy/{orgId}/template/{format}:
    get:
      operationId: downloadEnergyTemplate
      parameters:
        - $ref: "#/components/parameters/EnergyOrg"
        - in: path
          name: format
          required: true
          schema: { type: string, enum: [csv, xlsx, demo-csv], default: csv }
      responses:
        "200":
          description: Downloadable blank import template or explicitly synthetic demo CSV
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /platform/energy/{orgId}/analyses/{id}/export/{format}:
    get:
      operationId: exportEnergyAnalysis
      parameters:
        - $ref: "#/components/parameters/EnergyOrg"
        - $ref: "#/components/parameters/EnergyId"
        - in: path
          name: format
          required: true
          schema: { type: string, enum: [csv, xlsx, pdf], default: csv }
      responses:
        "200":
          description: Reproducible report download
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /platform/session:
    get:
      operationId: getPlatformSession
      responses:
        "200":
          description: Current verified account and memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSession"
  /platform/auth/{action}:
    post:
      operationId: platformAuth
      parameters:
        - in: path
          name: action
          required: true
          schema:
            type: string
            enum: [signup, signin, signout, recovery, callback, password]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformCredentials"
      responses:
        "200":
          description: Account action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMessage"
  /platform/organisations:
    post:
      operationId: createPlatformOrganisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationInput"
      responses:
        "201":
          description: Created with initial owner atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOrganisation"
  /platform/organisations/{id}:
    patch:
      operationId: updatePlatformOrganisation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationInput"
      responses:
        "200":
          description: Updated organisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOrganisation"
  /platform/organisations/{id}/members:
    get:
      operationId: getPlatformMembers
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Authorised membership list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformMember"
    post:
      operationId: addPlatformMember
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipInput"
      responses:
        "200":
          description: Membership saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMessage"
  /platform/organisations/{id}/members/{userId}:
    delete:
      operationId: removePlatformMember
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Membership removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMessage"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Submit a consultation enquiry
      description: Validates and records a consultation enquiry for GEIT Ltd.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryReceipt"
        "400":
          description: Invalid enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many enquiries submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  parameters:
    EngineeringModulePath:
      in: path
      name: module
      required: true
      schema: { $ref: "#/components/schemas/EngineeringModule" }
    EnergyOrg:
      in: path
      name: orgId
      required: true
      schema: { type: string, format: uuid }
    EnergyId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  schemas:
    EngineeringModule:
      type: string
      enum: [energy-consulting, energy-auditing, renewable-energy, battery-flexibility, carbon-footprint, digital-energy]
    CarbonUnit:
      type: string
      enum: [kWh, MWh, GJ, L, m3, kg, km, passenger_km, tonne_km]
    CarbonScope:
      type: string
      enum: [scope1, scope2, scope3]
    CarbonCategory:
      type: string
      enum: [stationary_combustion, mobile_combustion, fugitive, process, purchased_electricity, purchased_heat, purchased_goods, upstream_fuel_energy, waste, business_travel, employee_commuting, upstream_transport, downstream_transport]
    EmissionFactorInput:
      type: object
      additionalProperties: false
      required: [code, name, source, sourceUrl, geography, activityUnit, emissionUnit, value, validFrom, validUntil, scope, category, scope2Method, gwpBasis]
      properties:
        code: { type: string, pattern: "^[A-Z0-9_-]{2,64}$" }
        name: { type: string, minLength: 2, maxLength: 160 }
        source: { type: string, minLength: 10, maxLength: 1000 }
        sourceUrl: { type: string, pattern: "^https://", maxLength: 1000 }
        geography: { type: string, minLength: 2, maxLength: 120 }
        activityUnit: { $ref: "#/components/schemas/CarbonUnit" }
        emissionUnit: { type: string, enum: [kgCO2e, tCO2e] }
        value: { type: number, minimum: 0, maximum: 1000000000 }
        validFrom: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        validUntil: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        scope: { $ref: "#/components/schemas/CarbonScope" }
        category: { $ref: "#/components/schemas/CarbonCategory" }
        scope2Method: { type: ["string", "null"], enum: [location_based, market_based, null] }
        gwpBasis: { type: string, minLength: 5, maxLength: 160 }
    EmissionFactor:
      allOf:
        - $ref: "#/components/schemas/EmissionFactorInput"
        - type: object
          required: [id, version, created_at]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
            created_at: { type: string }
    CarbonActivity:
      type: object
      additionalProperties: false
      required: [name, factorId, quantity, unit, geography, scope, category]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        factorId: { type: string, format: uuid }
        quantity: { type: number, minimum: 0, maximum: 1000000000000 }
        unit: { $ref: "#/components/schemas/CarbonUnit" }
        geography: { type: string, minLength: 2, maxLength: 120 }
        scope: { $ref: "#/components/schemas/CarbonScope" }
        category: { $ref: "#/components/schemas/CarbonCategory" }
    CarbonReduction:
      type: object
      additionalProperties: false
      required: [activityIndex, label, reductionPercent]
      properties:
        activityIndex: { type: integer, minimum: 0, maximum: 99 }
        label: { type: string, minLength: 2, maxLength: 160 }
        reductionPercent: { type: number, minimum: 0, maximum: 100 }
    CarbonInputs:
      type: object
      additionalProperties: false
      required: [model, sourceNotes, periodStart, periodEnd, boundary, scope2Method, activities, reductions]
      properties:
        model: { type: string, enum: [carbon] }
        sourceNotes: { type: string, minLength: 10, maxLength: 2000 }
        periodStart: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        periodEnd: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        boundary: { type: string, minLength: 10, maxLength: 2000 }
        scope2Method: { type: string, enum: [location_based, market_based] }
        activities:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/CarbonActivity" }
        reductions:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CarbonReduction" }
    TwinBattery:
      type: object
      additionalProperties: false
      required: [capacityKwh, minSocPercent, maxSocPercent, initialSocPercent, maxChargeKw, maxDischargeKw, chargeEfficiency, dischargeEfficiency, dispatchMode]
      properties:
        capacityKwh: { type: number, exclusiveMinimum: 0, maximum: 10000000 }
        minSocPercent: { type: number, minimum: 0, maximum: 100 }
        maxSocPercent: { type: number, minimum: 0, maximum: 100 }
        initialSocPercent: { type: number, minimum: 0, maximum: 100 }
        maxChargeKw: { type: number, exclusiveMinimum: 0, maximum: 10000000 }
        maxDischargeKw: { type: number, exclusiveMinimum: 0, maximum: 10000000 }
        chargeEfficiency: { type: number, minimum: 0.01, maximum: 1 }
        dischargeEfficiency: { type: number, minimum: 0.01, maximum: 1 }
        dispatchMode: { type: string, enum: [self_consumption, peak_shaving] }
        gridTargetKw: { type: ["number", "null"], minimum: 0, maximum: 10000000 }
    TwinInputs:
      type: object
      additionalProperties: false
      required: [model, sourceNotes, buildingMeterId, solarMeterId, start, end, loadBasis, battery, forecastHorizonHours, anomalyThreshold]
      properties:
        model: { type: string, enum: [twin] }
        sourceNotes: { type: string, minLength: 10, maxLength: 2000 }
        buildingMeterId: { type: string, format: uuid }
        solarMeterId: { type: ["string", "null"], format: uuid }
        start: { type: string, maxLength: 40 }
        end: { type: string, maxLength: 40 }
        loadBasis: { type: string, enum: [gross_building_load] }
        battery:
          oneOf:
            - $ref: "#/components/schemas/TwinBattery"
            - type: "null"
        forecastHorizonHours: { type: integer, minimum: 1, maximum: 168 }
        anomalyThreshold: { type: number, minimum: 2, maximum: 10 }
    DigitalTwinSources:
      type: object
      required: [meters, sites, connectedProviderStatus, readingLimit]
      properties:
        meters:
          type: array
          items: { $ref: "#/components/schemas/EnergyMeter" }
        sites:
          type: array
          items: { $ref: "#/components/schemas/EnergySite" }
        connectedProviderStatus: { type: string, enum: [not_configured] }
        readingLimit: { type: integer }
    EvidenceQuestion:
      type: object
      additionalProperties: false
      required: [question, consent]
      properties:
        question: { type: string, minLength: 5, maxLength: 1000 }
        consent: { type: boolean, enum: [true] }
    EvidenceItem:
      type: object
      required: [id, text]
      properties:
        id: { type: string }
        text: { type: string }
    EvidenceAnswer:
      type: object
      required: [provider, model, scenarioId, inputHash, evidence, limitation]
      properties:
        provider: { type: string }
        model: { type: string }
        scenarioId: { type: string }
        inputHash: { type: string }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/EvidenceItem" }
        limitation: { type: string }
    EngineeringProjectInput:
      type: object
      additionalProperties: false
      required: [name, facility, brief, currency, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 120 }
        facility: { type: string, minLength: 2, maxLength: 160 }
        brief: { type: string, minLength: 10, maxLength: 4000 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        status: { type: string, enum: [draft, active, completed] }
        archived: { type: boolean }
    EngineeringProject:
      type: object
      required: [id, module, name, facility, brief, currency, status, archived, created_at]
      properties:
        id: { type: string }
        module: { $ref: "#/components/schemas/EngineeringModule" }
        name: { type: string }
        facility: { type: string }
        brief: { type: string }
        currency: { type: string }
        status: { type: string, enum: [draft, active, completed] }
        archived: { type: boolean }
        created_at: { type: string }
    ConsultingInputs:
      type: object
      additionalProperties: false
      required: [model, sourceNotes, energyUnit, baselineEnergy, proposedEnergy, tariffPerKwh, capex, annualOpexDelta, discountRatePercent, years]
      properties:
        model: { type: string, enum: [consulting] }
        sourceNotes: { type: string, minLength: 10, maxLength: 2000 }
        energyUnit: { type: string, enum: [kWh, MWh, GJ] }
        baselineEnergy: { type: number, minimum: 0, maximum: 1000000000 }
        proposedEnergy: { type: number, minimum: 0, maximum: 1000000000 }
        tariffPerKwh: { type: number, minimum: 0, maximum: 1000000 }
        capex: { type: number, minimum: 0, maximum: 1000000000000 }
        annualOpexDelta: { type: number, minimum: -1000000000, maximum: 1000000000 }
        discountRatePercent: { type: number, minimum: 0, maximum: 100 }
        years: { type: integer, minimum: 1, maximum: 50 }
    AuditMeasure:
      type: object
      additionalProperties: false
      required: [name, quantity, powerUnit, baselinePower, proposedPower, hoursPerYear, capex, annualOpexDelta]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        quantity: { type: integer, minimum: 1, maximum: 1000000 }
        powerUnit: { type: string, enum: [W, kW] }
        baselinePower: { type: number, minimum: 0, maximum: 1000000 }
        proposedPower: { type: number, minimum: 0, maximum: 1000000 }
        hoursPerYear: { type: number, minimum: 0, maximum: 8784 }
        capex: { type: number, minimum: 0, maximum: 1000000000000 }
        annualOpexDelta: { type: number, minimum: -1000000000, maximum: 1000000000 }
    AuditingInputs:
      type: object
      additionalProperties: false
      required: [model, sourceNotes, tariffPerKwh, discountRatePercent, years, measures]
      properties:
        model: { type: string, enum: [auditing] }
        sourceNotes: { type: string, minLength: 10, maxLength: 2000 }
        tariffPerKwh: { type: number, minimum: 0, maximum: 1000000 }
        discountRatePercent: { type: number, minimum: 0, maximum: 100 }
        years: { type: integer, minimum: 1, maximum: 50 }
        facilityBaselineKwh: { type: ["number", "null"], exclusiveMinimum: 0, maximum: 1000000000000 }
        measures:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: "#/components/schemas/AuditMeasure" }
    SolarMonth:
      type: object
      additionalProperties: false
      required: [month, irradiationKwhM2, demandKwh]
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        irradiationKwhM2: { type: number, minimum: 0, maximum: 500 }
        demandKwh: { type: number, minimum: 0, maximum: 1000000000 }
    SolarInputs:
      type: object
      additionalProperties: false
      required: [model, sourceNotes, irradiationUnit, capacityKwp, performanceRatio, coincidenceFactor, importRatePerKwh, exportRatePerKwh, capex, annualOpex, discountRatePercent, years, months]
      properties:
        model: { type: string, enum: [solar] }
        sourceNotes: { type: string, minLength: 10, maxLength: 2000 }
        irradiationUnit: { type: string, enum: [kWh/m2/month] }
        capacityKwp: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        performanceRatio: { type: number, exclusiveMinimum: 0, maximum: 1 }
        coincidenceFactor: { type: number, minimum: 0, maximum: 1 }
        importRatePerKwh: { type: number, minimum: 0, maximum: 1000000 }
        exportRatePerKwh: { type: number, minimum: 0, maximum: 1000000 }
        capex: { type: number, minimum: 0, maximum: 1000000000000 }
        annualOpex: { type: number, minimum: 0, maximum: 1000000000 }
        discountRatePercent: { type: number, minimum: 0, maximum: 100 }
        years: { type: integer, minimum: 1, maximum: 50 }
        months:
          type: array
          minItems: 12
          maxItems: 12
