openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: enquiries
    description: Public consultation enquiries
paths:
  /platform/session:
    get:
      operationId: getPlatformSession
      responses:
        "200":
          description: Current verified account and memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSession"
  /platform/auth/{action}:
    post:
      operationId: platformAuth
      parameters:
        - in: path
          name: action
          required: true
          schema:
            type: string
            enum: [signup, signin, signout, recovery, callback, password]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformCredentials"
      responses:
        "200":
          description: Account action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMessage"
  /platform/organisations:
    post:
      operationId: createPlatformOrganisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationInput"
      responses:
        "201":
          description: Created with initial owner atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOrganisation"
  /platform/organisations/{id}:
    patch:
      operationId: updatePlatformOrganisation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationInput"
      responses:
        "200":
          description: Updated organisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOrganisation"
  /platform/organisations/{id}/members:
    get:
      operationId: getPlatformMembers
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Authorised membership list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformMember"
    post:
      operationId: addPlatformMember
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipInput"
      responses:
        "200":
          description: Membership saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMessage"
  /platform/organisations/{id}/members/{userId}:
    delete:
      operationId: removePlatformMember
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Membership removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMessage"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Submit a consultation enquiry
      description: Validates and records a consultation enquiry for GEIT Ltd.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryReceipt"
        "400":
          description: Invalid enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many enquiries submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    PlatformCredentials:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
        fullName: { type: string, minLength: 2, maxLength: 120 }
        code: { type: string, minLength: 1, maxLength: 2048 }
    PlatformMessage:
      type: object
      required: [message]
      properties:
        message: { type: string }
    PlatformUser:
      type: object
      required: [id, email, fullName]
      properties:
        id: { type: string }
        email: { type: string }
        fullName: { type: string }
    PlatformSession:
      type: object
      required: [user, organisations]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/PlatformUser"
            - type: "null"
        organisations:
          type: array
          items:
            $ref: "#/components/schemas/PlatformOrganisation"
    OrganisationInput:
      type: object
      additionalProperties: false
      required: [name, timezone]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        timezone: { type: string, minLength: 1, maxLength: 80 }
    PlatformRole:
      type: string
      enum: [owner, admin, energy_manager, consultant, analyst, reader]
    PlatformOrganisation:
      type: object
      required: [id, name, timezone, role]
      properties:
        id: { type: string }
        name: { type: string }
        timezone: { type: string }
        role:
          $ref: "#/components/schemas/PlatformRole"
    MembershipInput:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role:
          $ref: "#/components/schemas/PlatformRole"
    PlatformMember:
      type: object
      required: [userId, fullName, role]
      properties:
        userId: { type: string }
        fullName: { type: string }
        role:
          $ref: "#/components/schemas/PlatformRole"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EnquiryInput:
      type: object
      additionalProperties: false
      required:
        - fullName
        - organization
        - businessEmail
        - country
        - serviceOfInterest
        - projectDescription
        - privacyConsent
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        organization:
          type: string
          minLength: 2
          maxLength: 160
        businessEmail:
          type: string
          format: email
          maxLength: 254
        telephone:
          type: ["string", "null"]
          maxLength: 40
        country:
          type: string
          minLength: 2
          maxLength: 80
        serviceOfInterest:
          type: string
          enum:
            - Energy Management
            - Energy Consulting
            - Energy Project Development
            - Energy Market Research
            - Energy Technology Solutions
            - Renewable Energy Advisory
            - Energy Efficiency & Energy Auditing
            - Battery Energy Storage & Energy Flexibility Consulting
            - EV Charging Infrastructure Advisory
            - AI-Powered Energy Analytics & Digital Energy Solutions
            - Carbon Footprint Services
            - Other
        projectDescription:
          type: string
          minLength: 20
          maxLength: 5000
        preferredContactMethod:
          type: ["string", "null"]
          enum: [email, phone, video-call, null]
        privacyConsent:
          type: boolean
          const: true
        website:
          type: string
          maxLength: 200
          description: Spam honeypot; must be empty when submitted by a person.
    EnquiryReceipt:
      type: object
      required: [accepted, reference, receivedAt]
      properties:
        accepted:
          type: boolean
          const: true
        reference:
          type: string
        receivedAt:
          type: string
          format: date-time
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

